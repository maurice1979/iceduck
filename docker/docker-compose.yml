
services:
  floci:
    # Official release containing floci-io/floci#3738 (Athena reads Iceberg
    # tables via iceberg_scan). Pinned to a tag, not `latest`, so a Floci upgrade
    # is a deliberate change — see docs/adr/0015-official-floci-release-image.md.
    image: floci/floci:2.2.0
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock   # Required for Lambda, ECS, RDS
    environment:
      - FLOCI_LOG_LEVEL=info
      - FLOCI_STORAGE_MODE=persistent
    restart: unless-stopped
volumes:
  floci-data: