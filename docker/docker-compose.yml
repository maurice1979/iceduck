
services:
  floci:
    # Pinned to our fork's Athena-Iceberg fix commit, not the official image,
    # until floci-io/floci#3738 is merged upstream — see
    # docs/adr/0008-pin-floci-fork-for-athena-iceberg-fix.md and the TODO to
    # switch back in docs/TODO.md.
    #
    # dockerfile_inline (not the upstream docker/Dockerfile as-is): upstream's
    # own Dockerfile only COPYs src/, but pom.xml's build-helper-maven-plugin
    # adds sidecars/cedar/src/main/java as an extra test-source root, so a
    # from-scratch `docker build .` fails test-compilation on main too — a
    # pre-existing, unrelated upstream gap, not something our fix introduced.
    # Worked around here (not on the fix branch, to keep that PR minimal) by
    # copying sidecars/ too. See the ADR for the full explanation.
    build:
      context: https://github.com/maurice1979/floci.git#9e2d89e723aa40fa7a5fdee2c419795947ba76cf
      dockerfile_inline: |
        FROM eclipse-temurin:25-jdk-noble AS build
        WORKDIR /build
        RUN apt-get update && apt-get install -y maven && rm -rf /var/lib/apt/lists/*
        COPY pom.xml .
        RUN mvn dependency:go-offline -q
        COPY src/ src/
        COPY sidecars/ sidecars/
        RUN mvn clean package -DskipTests -q

        FROM eclipse-temurin:25-jre-noble
        ARG VERSION=latest
        ENV FLOCI_VERSION=$${VERSION}
        ENV FLOCI_STORAGE_PERSISTENT_PATH=/app/data
        ENV AWS_DEFAULT_REGION=us-east-1
        ENV AWS_ACCESS_KEY_ID=test
        ENV AWS_SECRET_ACCESS_KEY=test
        ENV AWS_CONFIG_FILE=/etc/floci/aws/config
        RUN set -eux; \
            apt-get update; \
            apt-get install -y --no-install-recommends ca-certificates passwd python3 python3-pip wget; \
            rm -rf /var/lib/apt/lists/*; \
            pip3 install --no-cache-dir --break-system-packages awscli boto3; \
            aws_bin="$$(command -v aws)"; \
            mv "$$aws_bin" /usr/bin/aws.real; \
            printf '#!/bin/sh\nexec /usr/bin/aws.real --endpoint-url=http://localhost:4566 "$$@"\n' > /usr/bin/aws; \
            chmod +x /usr/bin/aws; \
            useradd -r -u 1001 -g root -d /app -s /sbin/nologin floci
        WORKDIR /app
        RUN mkdir -p /app/data /etc/floci/aws \
            && printf '[default]\nendpoint_url = http://localhost:4566\n' > /etc/floci/aws/config \
            && chown 1001:root /app \
            && chmod "g+rwX" /app \
            && chown 1001:root /app/data
        COPY --from=build /build/target/quarkus-app/ quarkus-app/
        RUN chown -R 1001:root /app/quarkus-app
        COPY --chmod=755 docker/entrypoint.sh /usr/local/bin/docker-entrypoint.sh
        COPY --chmod=755 docker/localstack-parity.sh /usr/local/bin/localstack-parity.sh
        VOLUME /app/data
        EXPOSE 4566
        HEALTHCHECK --interval=5s --timeout=3s --retries=5 \
            CMD wget -q --spider http://localhost:4566/_floci/health || exit 1
        ENTRYPOINT ["/usr/local/bin/docker-entrypoint.sh"]
        CMD ["java", "--enable-native-access=ALL-UNNAMED", "-jar", "/app/quarkus-app/quarkus-run.jar"]
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock   # Required for Lambda, ECS, RDS
    environment:
      - FLOCI_LOG_LEVEL=info
      - FLOCI_STORAGE_MODE=persistent
    restart: unless-stopped
volumes:
  floci-data: