[project]
name = "iceduck"
version = "0.1.0"
description = "IceDuck — a modern lakehouse on DuckDB, dbt, Apache Iceberg, and AWS Glue, running locally via Floci"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.94",
    "click>=8.5.0",
    "dbt-core>=1.12.4",
    "dbt-duckdb[glue]>=1.11.0",
    "duckdb>=1.5.5",
    "kaggle>=1.7",
    "pydantic-settings>=2.15.0",
    "pyiceberg[glue,pyarrow]>=0.12.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
iceduck = "iceduck.cli.main:cli"

[project.optional-dependencies]
dashboard = [
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iceduck"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
