[project]
name = "iceduck"
version = "0.1.0"
description = "IceDuck — a modern lakehouse on DuckDB, dbt, Apache Iceberg, and AWS Glue, running locally via Floci"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.94",
    "click>=8.5.0",
    "dbt-core>=1.12.4",
    "dbt-duckdb[glue]>=1.11.0",
    "duckdb>=1.5.5",
    "pydantic-settings>=2.15.0",
    "pyiceberg>=0.12.0",
    "python-dotenv>=1.2.3",
]
