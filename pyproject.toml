[project]
name = "iceduck"
version = "0.1.0"
description = "IceDuck — a modern lakehouse on DuckDB, dbt, Apache Iceberg, and AWS Glue, running locally via Floci"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.94",
    "click>=8.5.0",
    "dbt-core>=1.12.4",
    "dbt-duckdb[glue]>=1.11.0",
    "duckdb>=1.5.5",
    "kaggle>=1.7",
    "pydantic-settings>=2.15.0",
    "pyiceberg[glue,pyarrow]>=0.12.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
iceduck = "iceduck.cli.main:cli"

[project.optional-dependencies]
dashboard = [
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iceduck"]

[dependency-groups]
dev = [
    "boto3-stubs[glue,s3]>=1.43.97",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"conftest.py" = ["D", "ANN"]
"src/iceduck/*/__init__.py" = ["D"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kaggle.*", "plotly.*", "pyarrow.*"]
ignore_missing_imports = true
