version: 2

models:
  - name: dim_patient
    description: >
      Patient dimension — one row per patient, passthrough of stg_patients with the
      primary key renamed to patient_id for clean fact joins. Natural key (UUID),
      no surrogate key.
    columns:
      - name: patient_id
        description: Primary key, same UUID as stg_patients.id.
        tests: [not_null, unique]
  - name: dim_provider
    description: >
      Provider dimension — one row per healthcare provider, passthrough of
      stg_providers with the primary key renamed to provider_id.
    columns:
      - name: provider_id
        description: Primary key, same UUID as stg_providers.id.
        tests: [not_null, unique]
  - name: dim_organization
    description: >
      Organization dimension — one row per healthcare organization, passthrough of
      stg_organizations with the primary key renamed to organization_id.
    columns:
      - name: organization_id
        description: Primary key, same UUID as stg_organizations.id.
        tests: [not_null, unique]
  - name: dim_date
    description: >
      Generated calendar spine, not sourced from any staging table — one row per day
      covering the full date range found across encounters/medications/conditions
      (DuckDB generate_series over the min/max dates), with year/quarter/month/
      day-of-week attributes.
    columns:
      - name: date_day
        description: Primary key — a calendar date, joined from each fact's date FK column.
        tests: [not_null, unique]

  - name: fct_encounters
    description: >
      The central fact table — one row per patient encounter. FKs to dim_patient,
      dim_provider, dim_organization, and dim_date (via encounter_date), plus cost/
      coverage measures carried through from stg_encounters unchanged.
    columns:
      - name: encounter_id
        description: Primary key, same UUID as stg_encounters.id.
        tests: [not_null, unique]
      - name: patient_id
        description: FK to dim_patient.patient_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: organization_id
        description: FK to dim_organization.organization_id — the organization where the encounter took place.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: organization_id
      - name: provider_id
        description: FK to dim_provider.provider_id — the provider who attended the encounter.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_id
      - name: payer_id
        description: >
          UUID of the payer (insurer) billed for the encounter. Not an FK yet — Synthea's
          payers table isn't ingested, so there is no dim_payer.
        tests: [not_null]
      - name: encounter_date
        description: FK to dim_date.date_day — the encounter's start date.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: encounter_class
        description: >
          Setting of care. Drives the clinical marts — e.g. fct_readmissions keeps only
          'inpatient' stays.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['wellness', 'ambulatory', 'outpatient', 'urgentcare', 'emergency', 'inpatient']
      - name: code
        description: SNOMED-CT code of the encounter type.
        tests: [not_null]
      - name: description
        description: Human-readable label of the SNOMED-CT encounter code.
      - name: reason_code
        description: >
          SNOMED-CT code of the condition that motivated the encounter. Empty string
          (not NULL) when the encounter had no recorded reason — carried through
          unchanged from bronze.
      - name: reason_description
        description: Human-readable label of reason_code; empty string when there is no reason.
      - name: started_at
        description: Encounter start timestamp (timestamptz). encounter_date is its date part.
        tests: [not_null]
      - name: stopped_at
        description: Encounter end timestamp (timestamptz).
        tests: [not_null]
      - name: base_encounter_cost
        description: Base cost of the encounter itself, before procedures/medications/etc. are added to the claim.
        tests: [not_null, not_negative]
      - name: total_claim_cost
        description: Total cost billed on the encounter's claim.
        tests: [not_null, not_negative]
      - name: payer_coverage
        description: Portion of total_claim_cost paid by the payer; the patient pays the rest.
        tests: [not_null, not_negative]
  - name: fct_medications
    description: >
      One row per medication dispensed during an encounter. FKs to dim_patient and
      fct_encounters (no dim_encounter exists — encounters are themselves a fact),
      plus cost/dispense measures from stg_medications unchanged.
    columns:
      - name: patient_id
        description: FK to dim_patient.patient_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: encounter_id
        description: FK to fct_encounters.encounter_id — the encounter this medication was dispensed during.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_encounters')
                field: encounter_id
  - name: fct_conditions
    description: >
      One row per condition diagnosed during an encounter. FKs to dim_patient and
      fct_encounters, same pattern as fct_medications.
    columns:
      - name: patient_id
        description: FK to dim_patient.patient_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: encounter_id
        description: FK to fct_encounters.encounter_id — the encounter this condition was diagnosed during.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_encounters')
                field: encounter_id
      - name: code
        description: SNOMED-CT code of the condition. FK to the condition_categories seed.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('condition_categories')
                field: code
