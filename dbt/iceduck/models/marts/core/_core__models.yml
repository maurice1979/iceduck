version: 2

models:
  - name: dim_patient
    columns:
      - name: patient_id
        tests: [not_null, unique]
  - name: dim_provider
    columns:
      - name: provider_id
        tests: [not_null, unique]
  - name: dim_organization
    columns:
      - name: organization_id
        tests: [not_null, unique]
  - name: dim_date
    columns:
      - name: date_day
        tests: [not_null, unique]

  - name: fct_encounters
    columns:
      - name: encounter_id
        tests: [not_null, unique]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: encounter_date
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
  - name: fct_medications
    columns:
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: encounter_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_encounters')
                field: encounter_id
  - name: fct_conditions
    columns:
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: encounter_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_encounters')
                field: encounter_id
